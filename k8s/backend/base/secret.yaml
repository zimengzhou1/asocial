apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: asocial
type: Opaque
stringData:
  # JWT secret for signing anonymous session tokens
  #
  # ⚠️  IMPORTANT: This is a PLACEHOLDER - never use in production!
  #
  # For development: Run `make k8s-secrets-dev`
  # For production:  Run `./scripts/setup-secrets-prod.sh`
  #
  # Manual generation: openssl rand -hex 32
  jwt-secret: "PLACEHOLDER_DO_NOT_USE_IN_PRODUCTION"
